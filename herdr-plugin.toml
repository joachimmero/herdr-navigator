id = "joachimmero.herdr-md"
name = "herdr-md"
version = "0.1.0"
# 0.9.0 resolves pane commands against the plugin root.
min_herdr_version = "0.9.3"
platforms = ["macos"]
description = "Read markdown files in a pane beside the chat."

[[panes]]
id = "pane"
title = "herdr-md"
placement = "split"
command = ["bin/herdr-md"]

[[actions]]
id = "toggle"
title = "herdr-md: toggle pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-md", "--action", "toggle"]

[[actions]]
id = "open"
title = "herdr-md: open pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-md", "--action", "open"]

[[actions]]
id = "close"
title = "herdr-md: close pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-md", "--action", "close"]
