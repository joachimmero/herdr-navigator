id = "joachimmero.herdr-navigator"
name = "herdr-navigator"
version = "0.1.0"
# 0.9.0 resolves pane commands against the plugin root.
min_herdr_version = "0.9.3"
platforms = ["macos", "windows"]
description = "Browse and read a project in a pane beside the chat."

[[panes]]
id = "pane"
title = "herdr-navigator"
placement = "split"
command = ["bin/herdr-navigator"]

[[actions]]
id = "toggle"
title = "herdr-navigator: toggle pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-navigator", "--action", "toggle"]

[[actions]]
id = "open"
title = "herdr-navigator: open pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-navigator", "--action", "open"]

[[actions]]
id = "close"
title = "herdr-navigator: close pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-navigator", "--action", "close"]
