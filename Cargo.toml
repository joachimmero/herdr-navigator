[package]
name = "herdr-navigator"
version = "0.1.0"
edition = "2024"
description = "A herdr pane for browsing and reading a project beside the chat."
publish = false

[dependencies]
fff-search = "0.11.0"
ignore = "0.4"
notify = "=9.0.0-rc.5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
